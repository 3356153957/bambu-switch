name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test, build and package
        run: python package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: BambuAccountSwitcher
          path: |
            output/BambuAccountSwitcher-*.zip
            output/SHA256SUMS.txt
